[alembic]
script_location = alembic
prepend_sys_path = .
# ⚠️ مقدار از DATABASE_URL (environment variable) خوانده می‌شود.
# در env.py تنظیم شده: config.set_main_option("sqlalchemy.url", os.environ["DATABASE_URL"])
# Local:   export DATABASE_URL=postgresql+asyncpg://distribution_user:distribution_pass@localhost:5432/distribution_db
# Docker:  DATABASE_URL=postgresql+asyncpg://distribution_user:distribution_pass@postgres:5432/distribution_db
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
