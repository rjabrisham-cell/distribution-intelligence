{% extends "base.html" %}

{% block title %}New Project | Distribution Intelligence{% endblock %}

{% block content %}
<section class="dashboard-page">
    <section class="hero-card">
        <div class="hero-content">
            <div>
                <span class="hero-badge">New Project</span>
                <h2>ایجاد پروژه جدید</h2>
                <p>
                    این فرم در Sprint 1 صرفاً برای نمایش جریان کاری آماده شده و
                    هنوز به ذخیره‌سازی واقعی متصل نیست.
                </p>
            </div>
        </div>
    </section>

    <section class="panel-card">
        <div class="panel-header">
            <h3>فرم تعریف پروژه</h3>
        </div>

        <form class="project-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="projectName">نام پروژه</label>
                    <input id="projectName" type="text" placeholder="مثلاً پروژه توزیع منطقه 5" />
                </div>

                <div class="form-group">
                    <label for="companyName">نام شرکت</label>
                    <input id="companyName" type="text" placeholder="نام شرکت / مشتری" />
                </div>

                <div class="form-group">
                    <label for="scenarioType">نوع سناریو</label>
                    <select id="scenarioType">
                        <option>توزیع روزانه</option>
                        <option>توزیع بین‌شهری</option>
                        <option>توزیع فوری</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fleetSize">تعداد ناوگان</label>
                    <input id="fleetSize" type="number" placeholder="مثلاً 25" />
                </div>
            </div>

            <div class="form-group">
                <label for="projectDescription">توضیحات</label>
                <textarea id="projectDescription" rows="5" placeholder="توضیح مختصر پروژه..."></textarea>
            </div>

            <div class="hero-actions">
                <button type="button" class="btn btn-primary">ثبت نمایشی</button>
                <a href="/dashboard" class="btn btn-secondary">بازگشت به داشبورد</a>
            </div>
        </form>
    </section>
</section>
{% endblock %}
