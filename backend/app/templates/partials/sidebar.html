<aside class="dip-sidebar">
    <div class="dip-sidebar-top">
        <a href="/" class="dip-brand">
            <span class="dip-brand-mark">D</span>
            <div class="dip-brand-copy">
                <strong>DIP</strong>
                <small>Distribution Intelligence</small>
            </div>
        </a>

        <div class="dip-sidebar-company">
            <span class="dip-kicker">Company</span>
            <strong>{{ company_name }}</strong>
            <small>{{ company_code }}</small>
        </div>
    </div>

    <nav class="dip-sidebar-nav">
        <div class="dip-nav-group">
            <span class="dip-nav-title">Flow</span>

            <a href="/" class="dip-nav-link {% if current_path == '/' %}is-active{% endif %}">
                <span>Landing</span>
            </a>

            <a href="/projects" class="dip-nav-link {% if current_path.startswith('/projects') %}is-active{% endif %}">
                <span>Projects</span>
            </a>

            <a href="/dashboard" class="dip-nav-link {% if current_path == '/dashboard' %}is-active{% endif %}">
                <span>Decision Dashboard</span>
            </a>
        </div>

        <div class="dip-nav-group">
            <span class="dip-nav-title">Validation Backbone</span>

            <div class="dip-nav-static">Company</div>
            <div class="dip-nav-static">Project</div>
            <div class="dip-nav-static">Validation</div>
            <div class="dip-nav-static">Audit</div>
            <div class="dip-nav-static">Completeness</div>
            <div class="dip-nav-static">Geo</div>
            <div class="dip-nav-static">Readiness</div>
        </div>
    </nav>

    <div class="dip-sidebar-bottom">
        <div class="dip-readiness-mini">
            <div class="dip-readiness-mini-head">
                <span>Readiness</span>
                <strong>{{ readiness_value }}%</strong>
            </div>
            <div class="dip-progress">
                <span style="width: {{ readiness_value }}%;"></span>
            </div>
            <small>{{ readiness_label }}</small>
        </div>
    </div>
</aside>
