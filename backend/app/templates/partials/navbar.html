<header class="dip-topbar">
    <div class="dip-topbar-left">
        <div class="dip-context-chip">
            <span class="dip-context-label">Company</span>
            <strong>{{ company_name }}</strong>
        </div>

        <div class="dip-context-chip">
            <span class="dip-context-label">Project</span>
            <strong>{{ project_name }}</strong>
        </div>

        <div class="dip-context-chip">
            <span class="dip-context-label">Status</span>
            <strong>{{ project_status }}</strong>
        </div>
    </div>

    <div class="dip-topbar-right">
        <div class="dip-userbox">
            <div class="dip-userbox-meta">
                <strong>{{ user_name }}</strong>
                <small>{{ user_role }}</small>
            </div>
            <div class="dip-avatar">{{ user_initial }}</div>
        </div>
    </div>
</header>
