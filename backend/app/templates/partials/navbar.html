<header class="dip-navbar">
    <div class="dip-navbar__start">
        <button type="button" class="dip-navbar__icon-btn" data-sidebar-toggle aria-label="باز و بسته کردن سایدبار">
            <i class="bi bi-list"></i>
        </button>

        <div class="dip-navbar__title-wrap">
            <div class="dip-navbar__eyebrow">Distribution Intelligence Platform</div>
            <div class="dip-navbar__title">
                {% block navbar_title %}Application Shell{% endblock %}
            </div>
        </div>
    </div>

    <div class="dip-navbar__end">
        <a href="/projects/new" class="dip-btn dip-btn-primary dip-btn-sm">
            <i class="bi bi-plus-lg"></i>
            <span>پروژه جدید</span>
        </a>

        <a href="/projects" class="dip-btn dip-btn-secondary dip-btn-sm">
            <i class="bi bi-folder2-open"></i>
            <span>پروژه‌ها</span>
        </a>
    </div>
</header>
