{% extends "base.html" %}

{% block title %}پروژه جدید{% endblock %}

{% block content %}
<div class="container">
    <h1>ایجاد پروژه جدید</h1>

    <form method="POST" action="/projects">
        <div class="form-group">
            <label for="mobile">شماره موبایل</label>
            <input
                type="text"
                id="mobile"
                name="mobile"
                class="form-control"
                required
                placeholder="مثال: 09123456789"
            >
        </div>

        <div class="form-group">
            <label for="company_name">نام شرکت</label>
            <input
                type="text"
                id="company_name"
                name="company_name"
                class="form-control"
                required
                placeholder="نام شرکت خود را وارد کنید"
            >
        </div>

        <div class="form-group">
            <label for="project_name">نام پروژه</label>
            <input
                type="text"
                id="project_name"
                name="project_name"
                class="form-control"
                required
                placeholder="نام پروژه را وارد کنید"
            >
        </div>

        <div class="form-group">
            <label for="description">توضیحات</label>
            <textarea
                id="description"
                name="description"
                class="form-control"
                rows="4"
                placeholder="توضیحات پروژه (اختیاری)"
            ></textarea>
        </div>

        <button type="submit" class="btn btn-primary">ایجاد پروژه</button>
    </form>
</div>
{% endblock %}
