<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}DIP{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/dip.css">

    {% block head %}{% endblock %}
</head>
<body class="dip-body">
    <div class="dip-app-shell">
        {% include "partials/sidebar.html" %}

        <div class="dip-main-shell">
            {% include "partials/navbar.html" %}

            <main class="dip-content" id="main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script>
        (function () {
            const body = document.body;
            const toggleButtons = document.querySelectorAll('[data-sidebar-toggle]');
            const sidebarLinks = document.querySelectorAll('.dip-sidebar__group-toggle');

            toggleButtons.forEach(btn => {
                btn.addEventListener('click', function () {
                    body.classList.toggle('dip-sidebar-collapsed');
                });
            });

            sidebarLinks.forEach(btn => {
                btn.addEventListener('click', function () {
                    const parent = btn.closest('.dip-sidebar__group');
                    if (parent) parent.classList.toggle('is-open');
                });
            });
        })();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
