version: "3.9"

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: distribution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: distribution_intelligence
      POSTGRES_USER: distribution_user
      POSTGRES_PASSWORD: distribution_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distribution_user -d distribution_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: distribution_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: distribution_pgadmin
    user: root
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: fishoppingshop1405@gmail.com
      PGADMIN_DEFAULT_PASSWORD: strong_pgadmin_password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
